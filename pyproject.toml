[project]
name = "rl-desde-cero"
version = "0.1.0"
description = "Código complementario del libro «Reinforcement Learning desde cero»"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexis Alulema", email = "alexis.alulema@gmail.com" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.2",
    "torch>=2.6",
    "gymnasium>=1.1",
    "matplotlib>=3.10",
    "stable-baselines3>=2.6",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlcar", "src/algos"]

# En Linux (CI), torch se instala desde el índice de solo CPU para no bajar CUDA.
# En macOS, la rueda de PyPI ya es de CPU.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
